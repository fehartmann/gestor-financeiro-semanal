<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><path fill=%22%234f46e5%22 d=%22M64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32zm64 192c17.7 0 32 14.3 32 16l0 64c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l32 0zM432 256c13.3 0 24 10.7 24 24s-10.7 24-24 24l-96 0c-13.3 0-24-10.7-24-24s10.7-24 24-24l96 0z%22/></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Financeiro Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .kanban-drop-zone { min-height: 150px; transition: background-color 0.2s; }
        .kanban-drop-zone.drag-over { background-color: #f1f5f9; border: 2px dashed #6366f1; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col">

    <div id="telaAuth" class="fixed inset-0 bg-indigo-950 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 bg-indigo-100 text-indigo-600 rounded-full text-2xl mb-1">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Gestor Financeiro Pro</h2>
                <p class="text-xs text-slate-500">Faça login para acessar suas finanças de qualquer lugar</p>
            </div>
            <div id="erroAuth" class="hidden bg-rose-50 border-l-4 border-rose-500 p-3 text-xs text-rose-700 rounded-r-lg"></div>
            <form onsubmit="realizarAutenticacao(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-600 block mb-1">E-mail</label>
                    <input type="email" id="authEmail" autocomplete="email" required class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-600" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 block mb-1">Senha</label>
                    <input type="password" id="authSenha" autocomplete="current-password" required class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-600" placeholder="••••••••">
                </div>
                <button type="submit" id="btnSubmitAuth" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-lg shadow-indigo-200">
                    Entrar no Sistema
                </button>
            </form>
            <div class="text-center pt-2 border-t border-slate-100">
                <button type="button" onclick="alternarModoAuth()" id="btnAlternarAuth" class="text-xs font-semibold text-indigo-600 hover:underline">
                    Não tem uma conta? Crie uma agora
                </button>
            </div>
        </div>
    </div>

    <div id="sistemaApp" class="hidden h-full flex flex-col">
        <header class="bg-indigo-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div>
                    <h1 class="text-xl font-bold flex items-center gap-2">
                        <i class="fa-solid fa-wallet text-indigo-400"></i> Gestor Financeiro Pro
                    </h1>
                    <p class="text-xs text-indigo-200" id="infoUsuarioLogado">Sincronizado na Nuvem</p>
                </div>
                <div class="flex items-center gap-2 bg-indigo-800/80 px-3 py-1.5 rounded-lg border border-indigo-700 flex-wrap justify-end">
                    <label for="mesSelect" class="text-xs font-medium text-indigo-200">Mês:</label>
                    <select id="mesSelect" onchange="mudarMes(this.value)" class="bg-indigo-950 text-white text-sm
